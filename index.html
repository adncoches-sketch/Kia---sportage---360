<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow"><title>ADN Coches · Kia Sportage 360°</title><meta name="description" content="Kia Sportage GT-Line HEV: exterior interactivo e interior 360° por ADN Coches."><meta property="og:title" content="ADN Coches · Kia Sportage 360°"><meta property="og:description" content="Explora exterior e interior y pide asesoramiento independiente."><style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;height:100%}body{overflow:hidden}.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:12px 14px;background:linear-gradient(#111e,transparent);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.08em}.tabs{display:flex;gap:8px}.tabs button,.ctrl,.cta{border:0;border-radius:999px;padding:10px 14px;font-weight:700}.tabs button{background:#ffffff22;color:#fff}.tabs .on{background:#fff;color:#111}.stage{height:100%;width:100%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 55%,#555,#202020 65%,#111)}#car{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;touch-action:none}.hint{position:absolute;bottom:86px;background:#0009;padding:8px 12px;border-radius:999px;font-size:13px;pointer-events:none}.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:center;gap:8px;background:linear-gradient(transparent,#111e)}.ctrl{background:#fff;color:#111}.cta{background:#d7b45a;color:#111;text-decoration:none}.hidden{display:none!important}#pano{position:absolute;inset:0}.privacy{position:fixed;right:10px;bottom:8px;font-size:9px;color:#aaa;z-index:2}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"></head><body>
<div class="top"><div class="brand">ADN COCHES</div><div class="tabs"><button id="ext" class="on">Exterior</button><button id="int">Interior 360°</button></div></div>
<div id="exterior" class="stage"><img id="car" src="01_frontal.png" alt="Kia Sportage GT-Line HEV"><div class="hint">Desliza para girar el coche</div></div>
<div id="interior" class="stage hidden"><div id="pano"></div><div class="hint">Arrastra · mueve el móvil para explorar</div></div>
<div class="bottom"><button id="center" class="ctrl">Centrar</button><a class="cta" href="https://forms.gle/KTeU8hB5Bcdop95G9" target="_blank" rel="noopener">Más información</a></div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script><script>
const frames=['01_frontal.png','Kia Sportage GT-Line, vista frontal derecha.png','02_lateral_derecho.png','Kia Sportage GT-Line en ángulo intermedio.png','03_trasera.png','Kia Sportage GT-Line, vista trasera izquierda.png','04_lateral_izquierdo.png','Kia Sportage GT-Line verde lima.png'];
frames.forEach(s=>{const i=new Image;i.src=s});let idx=0,startX=null,acc=0;const car=document.getElementById('car');
function show(){car.src=frames[(idx%frames.length+frames.length)%frames.length]}
function down(x){startX=x;acc=0} function move(x){if(startX===null)return;let d=x-startX; if(Math.abs(d)>32){idx+=d<0?1:-1;show();startX=x}}
function up(){startX=null} car.onpointerdown=e=>{car.setPointerCapture(e.pointerId);down(e.clientX)};car.onpointermove=e=>move(e.clientX);car.onpointerup=up;car.onpointercancel=up;
let viewer=null;const ex=document.getElementById('exterior'),inn=document.getElementById('interior'),be=document.getElementById('ext'),bi=document.getElementById('int');
function exterior(){ex.classList.remove('hidden');inn.classList.add('hidden');be.classList.add('on');bi.classList.remove('on')}
function interior(){ex.classList.add('hidden');inn.classList.remove('hidden');bi.classList.add('on');be.classList.remove('on');if(!viewer)viewer=pannellum.viewer('pano',{type:'equirectangular',panorama:'Interior 360° del Kia Sportage GT-Line.png',autoLoad:true,showControls:false,compass:false,orientationOnByDefault:true,hfov:105,pitch:0,yaw:0})}
be.onclick=exterior;bi.onclick=interior;document.getElementById('center').onclick=()=>{if(!inn.classList.contains('hidden')&&viewer){viewer.setPitch(0);viewer.setYaw(0);viewer.setHfov(105)}else{idx=0;show()}};
</script></body></html>
